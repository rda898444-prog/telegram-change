name: Upload Single Video to Telegram (Test)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'اسم Release (مثلاً v1)'
        required: true
        default: 'v1'
        type: string
      filename:
        description: 'اسم دقیق فایل در Release (مثلاً Damage.1992.mp4)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install telethon cryptg hachoir

      - name: Download from Release & Upload to Telegram
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.TELEGRAM_SESSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILENAME: ${{ inputs.filename }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "⬇️ Downloading $FILENAME from Release..."
          gh release download "$TAG" --pattern "$FILENAME" --repo ${{ github.repository }}
          
          echo "⬆️ Starting upload to Telegram..."
          python - <<'PY'
          import os
          import time
          import asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          api_id = int(os.environ["API_ID"])
          api_hash = os.environ["API_HASH"]
          session_str = os.environ["SESSION_STRING"]
          filename = os.environ["FILENAME"]

          # متغیرهای مربوط به لاگ پیشرفت
          start_time = time.time()
          state = {'last_mb': 0}

          def progress_callback(sent, total):
              sent_mb = sent / (1024 * 1024)
              total_mb = total / (1024 * 1024)
              # چاپ هر ۱۰ مگابایت
              if sent_mb - state['last_mb'] >= 10 or sent == total:
                  state['last_mb'] = sent_mb
                  elapsed = time.time() - start_time
                  speed = sent_mb / elapsed if elapsed > 0 else 0
                  percent = (sent / total) * 100
                  print(f"   ⬆️ Upload Progress: {percent:.1f}% ({sent_mb:.1f}/{total_mb:.1f} MB) | Speed: {speed:.2f} MB/s", flush=True)

          async def main():
              print(f"Connecting to Telegram...")
              async with TelegramClient(StringSession(session_str), api_id, api_hash) as client:
                  print(f"Uploading {filename} to Saved Messages...")
                  try:
                      await client.send_file(
                          'me', 
                          filename, 
                          caption=f"✅ {filename}",
                          progress_callback=progress_callback,
                          supports_streaming=True,  # فعال کردن استریم
                          force_document=False      # ارسال به عنوان ویدیو، نه فایل
                      )
                      print(f"\n🎉 Upload Complete! Check your Saved Messages.")
                  except Exception as e:
                      print(f"\n❌ Error uploading: {e}")

          asyncio.run(main())
          PY
          
          # بدون دستور حذف (rm) تا فایل در گیت‌هاب باقی بماند
          echo "ℹ️ File remains safely in GitHub Release."
