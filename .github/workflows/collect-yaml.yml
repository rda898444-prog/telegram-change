name: Collect YAML Files

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-yaml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and merge all YAML files
        run: |
          OUTPUT="all-yaml-files.txt"
          > "$OUTPUT"

          find . -type f \( -name "*.yml" -o -name "*.yaml" \) \
            -not -path "./.git/*" \
            -not -path "*/node_modules/*" \
            | sort | while read -r file; do
              echo "===========================================" >> "$OUTPUT"
              echo "FILE: $file" >> "$OUTPUT"
              echo "===========================================" >> "$OUTPUT"
              cat "$file" >> "$OUTPUT"
              echo -e "\n" >> "$OUTPUT"
          done

      - name: Upload to Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yaml-collection-${{ github.run_id }}
          name: "YAML Collection - ${{ github.run_number }}"
          body: "همه فایل‌های YAML مخزن در یک فایل جمع‌آوری شدند."
          files: all-yaml-files.txt
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Download Link
        run: |
          echo "==========================================="
          echo "✅ فایل با موفقیت در Releases آپلود شد"
          echo "🔗 لینک دانلود مستقیم:"
          echo "${{ fromJSON(steps.release.outputs.assets)[0].browser_download_url }}"
          echo "==========================================="
