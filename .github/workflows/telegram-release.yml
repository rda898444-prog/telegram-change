name: Telegram Saved Messages -> Release

on:
  workflow_dispatch:
    inputs:
      file_count:
        description: "How many newest videos from Saved Messages?"
        required: true
        default: "5"

      runner_count:
        description: "How many GitHub runners? (1-20)"
        required: true
        default: "3"

      release_tag:
        description: "Release tag"
        required: true
        default: "telegram-files"

      release_name:
        description: "Release name"
        required: true
        default: "Telegram Files"

      filename_prefix:
        description: "Optional prefix for uploaded filenames"
        required: false
        default: ""

permissions:
  contents: write


jobs:

  # ---------------------------------------------------------
  # Prepare runner matrix + Release
  # ---------------------------------------------------------

  prepare:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      actual_runners: ${{ steps.matrix.outputs.actual_runners }}

    steps:

      - name: Validate inputs and create matrix
        id: matrix
        shell: bash
        env:
          FILE_COUNT: ${{ inputs.file_count }}
          RUNNER_COUNT: ${{ inputs.runner_count }}

        run: |
          set -euo pipefail

          [[ "$FILE_COUNT" =~ ^[0-9]+$ ]] || {
            echo "file_count must be an integer"
            exit 1
          }

          [[ "$RUNNER_COUNT" =~ ^[0-9]+$ ]] || {
            echo "runner_count must be an integer"
            exit 1
          }

          if (( FILE_COUNT < 1 || FILE_COUNT > 100 )); then
            echo "file_count must be between 1 and 100"
            exit 1
          fi

          if (( RUNNER_COUNT < 1 || RUNNER_COUNT > 20 )); then
            echo "runner_count must be between 1 and 20"
            exit 1
          fi

          ACTUAL="$RUNNER_COUNT"

          # No reason to create more runners than files.
          if (( ACTUAL > FILE_COUNT )); then
            ACTUAL="$FILE_COUNT"
          fi

          MATRIX=$(python3 - "$ACTUAL" <<'PY'
          import json
          import sys

          n = int(sys.argv[1])

          print(json.dumps({"runner": list(range(n))}, separators=(",", ":")))
          PY
          )

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "actual_runners=$ACTUAL" >> "$GITHUB_OUTPUT"

          echo "Files: $FILE_COUNT"
          echo "Runners: $ACTUAL"


      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          RELEASE_NAME: ${{ inputs.release_name }}

        shell: bash

        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            echo "Release already exists."

            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME"
          else
            echo "Creating release..."

            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME" \
              --notes "Videos from Telegram Saved Messages, optimized for streaming (moov atom first)."
          fi


  # ---------------------------------------------------------
  # Multiple GitHub runners
  # Each video is: downloaded -> FastStart fixed -> uploaded -> deleted.
  # Only the fixed video ends up in the Release; nothing stays on disk.
  # ---------------------------------------------------------

  telegram:
    needs: prepare

    runs-on: ubuntu-latest

    timeout-minutes: 360

    strategy:
      fail-fast: false

      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install dependencies
        shell: bash

        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          python -m pip install --upgrade pip
          pip install telethon cryptg


      - name: Download, fix (FastStart), upload, delete
        shell: bash

        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}

          FILE_COUNT: ${{ inputs.file_count }}
          RUNNER_INDEX: ${{ matrix.runner }}
          RUNNER_TOTAL: ${{ needs.prepare.outputs.actual_runners }}
          FILENAME_PREFIX: ${{ inputs.filename_prefix }}

          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}

        run: |
          set -euo pipefail

          python3 - <<'PY'
          import asyncio
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path

          from telethon import TelegramClient
          from telethon.sessions import StringSession

          API_ID = int(os.environ["API_ID"])
          API_HASH = os.environ["API_HASH"]
          SESSION = os.environ["TELEGRAM_SESSION"]
          FILE_COUNT = int(os.environ["FILE_COUNT"])
          RUNNER_INDEX = int(os.environ["RUNNER_INDEX"])
          RUNNER_TOTAL = int(os.environ["RUNNER_TOTAL"])
          PREFIX = os.environ.get("FILENAME_PREFIX", "").strip()
          TAG = os.environ["TAG"]
          REPO = os.environ["GITHUB_REPOSITORY"]

          WORK = Path("work")
          WORK.mkdir(exist_ok=True)
          RESULTS = Path("results.txt")

          # Only these can have a moov atom that FastStart can fix.
          VIDEO_EXTS = {".mp4", ".m4v", ".mov"}


          def safe_filename(name):
              # GitHub rewrites unusual characters in asset names, so keep it ASCII-safe.
              name = re.sub(r"[^A-Za-z0-9._-]+", "_", name).strip("._")
              return name or "telegram_video"


          def is_video(message):
              f = message.file
              return bool(f) and (f.ext or "").lower() in VIDEO_EXTS


          def moov_first(path):
              """True if the 'moov' atom comes before 'mdat' (file is streamable)."""
              total = os.path.getsize(path)
              pos = 0
              with open(path, "rb") as fh:
                  while pos + 8 <= total:
                      fh.seek(pos)
                      hdr = fh.read(8)
                      size = int.from_bytes(hdr[:4], "big")
                      kind = hdr[4:8]
                      if kind == b"moov":
                          return True
                      if kind == b"mdat":
                          return False
                      if size == 1:
                          size = int.from_bytes(fh.read(8), "big")
                      if size < 8:
                          return False
                      pos += size
              return False


          def faststart(src):
              """Move moov to the start without re-encoding. Replaces src in place."""
              tmp = src.with_name("fs_" + src.name)
              attempts = [
                  ["-map", "0"],
                  ["-map", "0:v", "-map", "0:a?"],  # fallback for odd data/subtitle streams
              ]
              for maps in attempts:
                  cmd = ["ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                         "-i", str(src), *maps, "-c", "copy",
                         "-movflags", "+faststart", str(tmp)]
                  r = subprocess.run(cmd)
                  if (r.returncode == 0 and tmp.exists()
                          and tmp.stat().st_size > 0 and moov_first(tmp)):
                      src.unlink()          # delete the original right away
                      tmp.rename(src)
                      return True
                  tmp.unlink(missing_ok=True)
              return False


          def upload(path):
              for attempt in range(1, 4):
                  r = subprocess.run(["gh", "release", "upload", TAG, str(path),
                                      "--repo", REPO, "--clobber"])
                  if r.returncode == 0:
                      return True
                  print(f"Upload attempt {attempt} failed")
                  time.sleep(5 * attempt)
              return False


          def make_progress():
              state = {"last": -5}

              def progress(current, total):
                  if not total:
                      return
                  percent = int(current * 100 / total)
                  if percent >= state["last"] + 5 or percent == 100:
                      state["last"] = percent
                      print(f"{percent}% | {current / 1048576:.1f} / {total / 1048576:.1f} MB",
                            flush=True)

              return progress


          def record(status, name):
              with RESULTS.open("a", encoding="utf-8") as fh:
                  fh.write(f"{status} {name}\n")


          async def main():
              client = TelegramClient(StringSession(SESSION), API_ID, API_HASH,
                                      request_retries=10, connection_retries=10,
                                      retry_delay=2, auto_reconnect=True)
              await client.connect()
              if not await client.is_user_authorized():
                  raise RuntimeError("TELEGRAM_SESSION is invalid or unauthorized")
              print("Connected to Telegram successfully.")

              # Newest MP4/M4V/MOV files only (everything else is ignored, never downloaded).
              newest = []
              scan_limit = max(100, FILE_COUNT * 20)
              async for message in client.iter_messages("me", limit=scan_limit):
                  if message.media and is_video(message):
                      newest.append(message)
                      if len(newest) >= FILE_COUNT:
                          break

              if not newest:
                  raise RuntimeError("No MP4/M4V/MOV videos found in Saved Messages.")
              print(f"Found {len(newest)} newest videos.")

              assigned = [(i, m) for i, m in enumerate(newest) if i % RUNNER_TOTAL == RUNNER_INDEX]
              print(f"Runner {RUNNER_INDEX + 1}/{RUNNER_TOTAL}, assigned: {len(assigned)}")

              failures = 0

              for position, message in assigned:
                  base = message.file.name or f"telegram_{message.id}{message.file.ext}"
                  filename = safe_filename(base)
                  if PREFIX:
                      filename = safe_filename(f"{PREFIX}_{filename}")
                  filename = f"{message.id}_{filename}"
                  target = WORK / filename
                  expected = int(message.file.size or 0)

                  print("\n--------------------------------")
                  print(f"Video {position + 1}/{len(newest)}: {filename}")
                  if expected:
                      print(f"Size: {expected / 1048576:.2f} MB")

                  try:
                      # 1) download
                      await client.download_media(message, file=str(target),
                                                  progress_callback=make_progress())
                      if not target.exists():
                          raise RuntimeError("download failed")
                      actual = target.stat().st_size
                      if expected and actual != expected:
                          raise RuntimeError(f"incomplete file ({actual}/{expected})")

                      # 2) make streamable (skip if moov is already first)
                      if moov_first(target):
                          print("moov already at start, no FFmpeg needed.")
                      elif faststart(target):
                          print("FastStart OK.")
                      else:
                          raise RuntimeError("FFmpeg FastStart failed")

                      # 3) upload only the fixed file
                      if not upload(target):
                          raise RuntimeError("upload failed")
                      print(f"Uploaded: {filename}")
                      record("OK", filename)

                  except Exception as e:
                      failures += 1
                      print(f"ERROR ({filename}): {e}")
                      record("FAILED", filename)

                  finally:
                      # Never keep anything on the runner disk.
                      for leftover in WORK.glob("*"):
                          leftover.unlink(missing_ok=True)

              await client.disconnect()

              if failures:
                  sys.exit(1)


          asyncio.run(main())
          PY


      - name: Summary
        if: always()

        shell: bash

        env:
          TAG: ${{ inputs.release_tag }}
          RUNNER_NUM: ${{ matrix.runner }}

        run: |
          {
              echo "## Telegram Downloader"
              echo
              echo "**Runner:** $RUNNER_NUM"
              echo
              echo "**Release:** \`$TAG\`"
              echo
              echo "### Videos"

              if [ -f results.txt ]
              then
                  while read -r status name
                  do
                      if [ "$status" = "OK" ]
                      then
                          echo "- ✅ \`$name\`"
                      else
                          echo "- ❌ \`$name\`"
                      fi
                  done < results.txt
              else
                  echo "_No videos processed on this runner._"
              fi
          } >> "$GITHUB_STEP_SUMMARY"
