name: Compress All Videos (Parallel Servers)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'اسم Release (مثلاً v1)'
        required: true
        default: 'v1'
        type: string
      max_parallel:
        description: 'حداکثر تعداد سرورهایی که همزمان کار کنند (پیشنهاد: 3 تا 5)'
        required: true
        default: '3'
        type: string

permissions:
  contents: write

jobs:
  # مرحله ۱: پیدا کردن لیست ویدیوها
  get-videos:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Get video list
        id: set-matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching video list from tag: ${{ inputs.tag }}"
          # استخراج فقط فایل‌های ویدیویی و ساخت فرمت JSON برای Matrix
          FILES=$(gh release view "${{ inputs.tag }}" --repo ${{ github.repository }} --json assets \
            --jq '[.assets[].name | select(test("\\.(mp4|mkv|avi|mov|m4v|webm)$"))] | tostring')
          
          if [ "$FILES" == "[]" ] || [ -z "$FILES" ]; then
            echo "❌ No video files found in this release."
            exit 1
          fi
          
          echo "Found files: $FILES"
          echo "matrix={\"file\":$FILES}" >> $GITHUB_OUTPUT

  # مرحله ۲: فشرده‌سازی (هر فیلم روی یک سرور مجزا)
  compress-video:
    needs: get-videos
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      max-parallel: ${{ fromJson(inputs.max_parallel) }} # محدودیت همزمانی برای جلوگیری از بلاک شدن
      fail-fast: false # اگر یکی خراب شد، بقیه ادامه دهند
      matrix: ${{ fromJson(needs.get-videos.outputs.matrix) }}
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download, Compress, Replace (${{ matrix.file }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILENAME: ${{ matrix.file }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "=================================================="
          echo "🎬 Processing: $FILENAME"
          
          # 1. دانلود فایل
          echo "⬇️ Downloading..."
          gh release download "$TAG" --pattern "$FILENAME" --repo ${{ github.repository }}
          
          # 2. فشرده‌سازی
          echo "🔧 Compressing with H.265..."
          if [[ "$FILENAME" =~ \.(mp4|mov|m4v)$ ]]; then
            FFMPEG_MOVFLAGS="-movflags +faststart"
          else
            FFMPEG_MOVFLAGS=""
          fi
          
          ffmpeg -y -hide_banner -loglevel warning -stats \
            -i "$FILENAME" \
            -c:v libx265 -crf 22 -preset slow \
            -c:a copy \
            $FFMPEG_MOVFLAGS \
            "compressed_$FILENAME"
          
          # 3. مقایسه و جایگزینی
          if [ -f "compressed_$FILENAME" ]; then
            ORIGINAL_SIZE=$(stat -c%s "$FILENAME")
            NEW_SIZE=$(stat -c%s "compressed_$FILENAME")
            
            echo "📊 Original: $((ORIGINAL_SIZE / 1024 / 1024)) MB | New: $((NEW_SIZE / 1024 / 1024)) MB"
            
            if [ "$NEW_SIZE" -lt "$ORIGINAL_SIZE" ]; then
              echo "✅ Size reduced. Uploading to Release..."
              
              # حذف فایل قبلی
              gh release delete-asset "$TAG" "$FILENAME" --yes --repo ${{ github.repository }}
              
              # آپلود فایل جدید (با همون اسم قبلی)
              mv "compressed_$FILENAME" "$FILENAME"
              gh release upload "$TAG" "$FILENAME" --clobber --repo ${{ github.repository }}
              
              echo "✅ $FILENAME replaced successfully."
            else
              echo "⚠️ Compressed file is larger. Keeping original."
            fi
          else
            echo "❌ Compression failed for $FILENAME"
            exit 1
          fi
