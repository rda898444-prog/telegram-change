name: Export Secrets for Pydroid

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Print Secrets (Base64 Encoded)
        run: |
          echo "👇 مقادیر زیر را کپی کنید 👇"
          echo "API_ID_B64=$(echo -n "${{ secrets.API_ID }}" | base64 -w 0)"
          echo "API_HASH_B64=$(echo -n "${{ secrets.API_HASH }}" | base64 -w 0)"
          echo "SESSION_STRING_B64=$(echo -n "${{ secrets.TELEGRAM_SESSION }}" | base64 -w 0)"
          echo "👆 مقادیر بالا را کپی کنید 👆"
