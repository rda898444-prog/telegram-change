name: Export Secrets to File

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Create secrets file
        run: |
          echo "API_ID_B64=$(echo -n "${{ secrets.API_ID }}" | base64 -w 0)" > secrets.txt
          echo "API_HASH_B64=$(echo -n "${{ secrets.API_HASH }}" | base64 -w 0)" >> secrets.txt
          echo "SESSION_STRING_B64=$(echo -n "${{ secrets.TELEGRAM_SESSION }}" | base64 -w 0)" >> secrets.txt

      - name: Upload secrets file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-secrets
          path: secrets.txt
          retention-days: 1
