name: Update Name

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: name-updater
  cancel-in-progress: true   # ← اینجا تغییر کرد

permissions:
  contents: write

jobs:
  update-name:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check Iran time (skip 00:00-06:59)
        id: timecheck
        run: |
          IRAN_HOUR=$(TZ="Asia/Tehran" date +%H)
          IRAN_HOUR=${IRAN_HOUR#0}
          IRAN_HOUR=${IRAN_HOUR:-0}
          echo "🇮🇷 ساعت ایران: $IRAN_HOUR"
          if [ "$IRAN_HOUR" -ge 7 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "⏸ بازه خواب - اجرا نمی‌شه."
          fi

      - name: Checkout repository
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ← اضافه شد

      - name: Set up Python
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.timecheck.outputs.run == 'true'
        run: pip install telethon

      - name: Run name.py
        if: steps.timecheck.outputs.run == 'true'
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python name.py

      - name: Commit state back to repo
        if: steps.timecheck.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f name_state.json ]; then
            git add name_state.json
            if git diff --staged --quiet; then
              echo "State تغییری نکرده."
            else
              git commit -m "chore: update name_state [skip ci]"
              git push
            fi
          fi
