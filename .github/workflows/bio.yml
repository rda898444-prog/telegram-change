name: Run Main Script

on:
  schedule:
    - cron: '0 */6 * * *'   # هر ۶ ساعت (به جای ۳ ساعت، امن‌تر برای عکس پروفایل)
  workflow_dispatch:

concurrency:
  group: main-updater
  cancel-in-progress: false

jobs:
  run-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check Iran time (skip 00:00-06:59)
        id: timecheck
        run: |
          IRAN_HOUR=$(TZ="Asia/Tehran" date +%H)
          IRAN_HOUR=${IRAN_HOUR#0}
          IRAN_HOUR=${IRAN_HOUR:-0}
          echo "🇮🇷 ساعت ایران: $IRAN_HOUR"
          if [ "$IRAN_HOUR" -ge 7 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "⏸ بازه خواب - اجرا نمی‌شه."
          fi

      - name: Checkout repository
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.timecheck.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install Pillow psutil telethon

      - name: Run main.py
        if: steps.timecheck.outputs.run == 'true'
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python main.py
