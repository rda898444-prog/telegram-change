name: Compress Video in Release (H.265)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'اسم Release (مثلاً v1)'
        required: true
        default: 'v1'
        type: string
      filename:
        description: 'اسم دقیق فایل در Release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  compress-video:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # حداکثر ۶ ساعت برای انکود سنگین
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download original file from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading ${{ inputs.filename }} from release ${{ inputs.tag }}..."
          gh release download ${{ inputs.tag }} --pattern "${{ inputs.filename }}" --output "original_video.mp4"
          
          # گرفتن حجم فایل اصلی
          ORIGINAL_SIZE=$(stat -c%s "original_video.mp4")
          echo "Original Size: $((ORIGINAL_SIZE / 1024 / 1024)) MB"

      - name: Compress Video (H.265 + Audio Copy)
        run: |
          echo "🔧 Starting compression (This might take a while)..."
          # -crf 22 : بهترین تعادل بین حجم و کیفیت (بدون افت محسوس)
          # -preset slow : فشرده‌سازی بیشتر با زمان طولانی‌تر
          # -c:a copy : کپی کردن صدای اصلی بدون هیچ افت کیفیت
          # -movflags +faststart : انتقال moov به اول برای پخش آنی
          ffmpeg -y -hide_banner -loglevel warning -stats \
            -i "original_video.mp4" \
            -c:v libx265 -crf 22 -preset slow \
            -c:a copy \
            -movflags +faststart \
            "compressed_video.mp4"

      - name: Compare Sizes and Replace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORIGINAL_SIZE=$(stat -c%s "original_video.mp4")
          NEW_SIZE=$(stat -c%s "compressed_video.mp4")
          
          echo "📊 Original Size: $((ORIGINAL_SIZE / 1024 / 1024)) MB"
          echo "📊 New Size:      $((NEW_SIZE / 1024 / 1024)) MB"
          
          if [ "$NEW_SIZE" -lt "$ORIGINAL_SIZE" ]; then
            echo "✅ Compression successful! Size reduced."
            
            # حذف فایل قدیمی
            echo "🗑️ Deleting old file from release..."
            gh release delete-asset ${{ inputs.tag }} "${{ inputs.filename }}" --yes
            
            # تغییر نام فایل فشرده شده به اسم اصلی
            mv "compressed_video.mp4" "${{ inputs.filename }}"
            
            # آپلود فایل جدید
            echo "⬆️ Uploading compressed file to Release..."
            gh release upload ${{ inputs.tag }} "${{ inputs.filename }}" --clobber
            echo "✅ Upload complete."
          else
            echo "⚠️ Warning: Compressed file is larger or equal. Keeping original."
            exit 0
          fi

      - name: Print result
        run: |
          LINK="https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/${{ inputs.filename }}"
          echo "🔗 Updated download link: $LINK"
          {
            echo "### 🔗 لینک دانلود (فشرده‌شده و استریم)"
            echo ""
            echo '```'
            echo "$LINK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
