name: Download Parallel & Safe (4 Servers)

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'تعداد فیلم‌هایی که باید دانلود شوند'
        required: true
        default: '8'
        type: string
      tag:
        description: 'Release tag (مثلاً v1)'
        required: true
        default: 'v1'
        type: string

permissions:
  contents: write

jobs:
  # مرحله ۱: پیدا کردن لیست فیلم‌ها از تلگرام
  get-messages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install telethon
        run: pip install telethon
      
      - name: Fetch latest files
        id: set-matrix
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.TELEGRAM_SESSION }}
          COUNT: ${{ inputs.count }}
        run: |
          python - <<'PY'
          import os, json, sys
          from telethon.sync import TelegramClient
          from telethon.sessions import StringSession

          client = TelegramClient(StringSession(os.environ["SESSION_STRING"]), int(os.environ["API_ID"]), os.environ["API_HASH"])
          client.start()
          
          count = int(os.environ["COUNT"])
          msgs = []
          for msg in client.get_messages('me', limit=100):
              if msg.media and (msg.video or msg.document):
                  name = msg.file.name or f"Video_{msg.id}.mp4"
                  msgs.append({"id": msg.id, "name": name})
                  if len(msgs) >= count:
                      break
                      
          if not msgs:
              print("No files found!")
              sys.exit(1)
              
          # ساخت JSON برای Matrix
          matrix_json = json.dumps({"video": msgs})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={matrix_json}\n")
          PY

  # مرحله ۲: دانلود موازی روی ۴ سرور
  download-video:
    needs: get-messages
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      max-parallel: 4 # حداکثر ۴ سرور همزمان
      fail-fast: false # اگر یکی خراب شد، بقیه ادامه بدن
      matrix: ${{ fromJson(needs.get-messages.outputs.matrix) }}
    steps:
      - name: Setup Python & ffmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install telethon cryptg

      - name: Download and Validate
        id: dl
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.TELEGRAM_SESSION }}
          MSG_ID: ${{ matrix.video.id }}
          FILE_NAME: ${{ matrix.video.name }}
        run: |
          python - <<'PY'
          import os, sys, subprocess, time
          from pathlib import Path
          from telethon.sync import TelegramClient
          from telethon.sessions import StringSession

          msg_id = int(os.environ["MSG_ID"])
          file_name = os.environ["FILE_NAME"]
          file_path = Path("files") / file_name
          file_path.parent.mkdir(exist_ok=True)

          client = TelegramClient(StringSession(os.environ["SESSION_STRING"]), int(os.environ["API_ID"]), os.environ["API_HASH"])
          client.start()

          print(f"🎬 Processing: {file_name} (ID: {msg_id})")
          message = client.get_messages('me', ids=msg_id)
          
          if not message:
              print(f"❌ Error: Message {msg_id} not found.")
              sys.exit(1)

          max_retries = 30
          retry_count = 0
          success = False

          while retry_count < max_retries:
              try:
                  current_size = file_path.stat().st_size if file_path.exists() else 0
                  if current_size > 0:
                      print(f"   🔄 Resuming from {current_size / (1024*1024):.1f} MB... (Attempt {retry_count+1}/{max_retries})")
                  else:
                      print(f"   ⬇️ Starting download... (Attempt {retry_count+1}/{max_retries})")
                      
                  # دانلود با قابلیت Resume
                  with open(file_path, "ab") as f:
                      for chunk in client.iter_download(message.media, offset=current_size):
                          f.write(chunk)
                  
                  # تست سلامت فایل
                  print(f"   🔍 Validating file...")
                  result = subprocess.run(
                      ["ffmpeg", "-v", "error", "-i", str(file_path), "-t", "5", "-f", "null", "-"],
                      capture_output=True
                  )
                  
                  if result.returncode == 0:
                      print(f"   ✅ File is valid and healthy!")
                      success = True
                      break
                  else:
                      print(f"   ❌ File is corrupted. Restarting download...")
                      file_path.unlink() # پاک کردن فایل خراب
                      retry_count += 1
                      
              except Exception as e:
                  retry_count += 1
                  print(f"   ⚠️ Connection dropped: {e}")
                  print(f"   ⏳ Waiting 10 seconds before retrying...")
                  time.sleep(10)

          if success:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("status=SUCCESS\n")
              # ساخت فایل وضعیت برای گزارش نهایی
              Path("status.txt").write_text(f"SUCCESS: {file_name}")
          else:
              print(f"   🚨 Failed after {max_retries} attempts.")
              if file_path.exists():
                  file_path.unlink()
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("status=FAILED\n")
              Path("status.txt").write_text(f"FAILED: {file_name}")
              sys.exit(1)
          PY

      - name: Upload to Release
        if: steps.dl.outputs.status == 'SUCCESS'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: files/*
          fail_on_unmatched_files: true

      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ matrix.video.id }}
          path: status.txt
          retention-days: 1

  # مرحله ۳: ساخت گزارش نهایی
  report:
    needs: download-video
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all status logs
        uses: actions/download-artifact@v4
        with:
          pattern: status-*
          merge-multiple: true
          path: logs

      - name: Print Final Summary
        run: |
          echo "### 📊 گزارش نهایی دانلود" >> $GITHUB_STEP_SUMMARY
          
          if [ ! -d "logs" ]; then
            echo "هیچ لاگی یافت نشد." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "✅ **فایل‌های موفق:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep "^SUCCESS:" logs/*.txt | sed 's/.*SUCCESS: //' >> $GITHUB_STEP_SUMMARY || echo "هیچ فایلی موفق نبود." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "❌ **فایل‌های ناموفق:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep "^FAILED:" logs/*.txt | sed 's/.*FAILED: //' >> $GITHUB_STEP_SUMMARY || echo "🎉 همه فایل‌ها موفق بودند!" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Print download links
        run: |
          echo "### 🔗 لینک‌های دانلود" >> $GITHUB_STEP_SUMMARY
          echo "برای دریافت فایل‌های موفق، به بخش Releases بروید." >> $GITHUB_STEP_SUMMARY
          LINK="https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }}"
          echo "[کلیک کنید تا به Releases بروید]($LINK)" >> $GITHUB_STEP_SUMMARY
