name: Download Multiple (10 Parallel Threads)

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'تعداد فیلم‌هایی که باید دانلود شوند'
        required: true
        default: '5'
        type: string
      msg_id:
        description: 'شماره پیام خاص (اختیاری)'
        required: false
        type: string
      tag:
        description: 'Release tag (مثلاً v1)'
        required: true
        default: 'v1'
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install telethon and cryptg
        run: |
          pip install telethon cryptg

      - name: Download from Telegram (10 Threads)
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.TELEGRAM_SESSION }}
          MSG_ID: ${{ inputs.msg_id }}
          COUNT: ${{ inputs.count }}
        run: |
          python - <<'PY'
          import os
          import sys
          import asyncio
          import time
          from pathlib import Path
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          api_id = int(os.environ["API_ID"])
          api_hash = os.environ["API_HASH"]
          session_str = os.environ["SESSION_STRING"]
          msg_id_str = os.environ.get("MSG_ID", "").strip()
          count = int(os.environ.get("COUNT", "5"))

          out_dir = Path("files")
          out_dir.mkdir(exist_ok=True)
          
          # متغیرهای سراسری برای پیشرفت
          downloaded_bytes = 0

          # دانلود یک تکه از فایل
          async def download_chunk(client, message, file_path, offset, limit):
              global downloaded_bytes
              with open(file_path, "r+b") as f:
                  f.seek(offset)
                  async for chunk in client.iter_download(message.media, offset=offset, limit=limit):
                      f.write(chunk)
                      downloaded_bytes += len(chunk)

          # نمایش پیشرفت و سرعت هر ۱۰ مگابایت
          async def monitor_progress(total_size):
              global downloaded_bytes
              last_mb = 0
              start_time = time.time()
              while downloaded_bytes < total_size:
                  await asyncio.sleep(1)
                  current_mb = downloaded_bytes / (1024 * 1024)
                  if current_mb - last_mb >= 10 or downloaded_bytes == total_size:
                      last_mb = current_mb
                      elapsed = time.time() - start_time
                      speed = current_mb / elapsed if elapsed > 0 else 0
                      percent = (downloaded_bytes / total_size) * 100
                      print(f"   ⬇️ Progress: {percent:.1f}% ({current_mb:.1f}/{total_size/(1024*1024):.1f} MB) | Speed: {speed:.2f} MB/s", flush=True)

          async def main():
              global downloaded_bytes
              client = TelegramClient(StringSession(session_str), api_id, api_hash)
              await client.start()
              
              messages_to_download = []
              
              if msg_id_str:
                  try:
                      msg_id = int(msg_id_str)
                      msg = await client.get_messages('me', ids=msg_id)
                      if msg and msg.media:
                          messages_to_download.append(msg)
                  except ValueError:
                      pass
              
              if not messages_to_download:
                  print(f"Searching for the latest {count} videos/files in Saved Messages...")
                  async for msg in client.iter_messages('me', limit=100):
                      if msg.media and (msg.video or msg.document):
                          messages_to_download.append(msg)
                          if len(messages_to_download) >= count:
                              break
                              
              if not messages_to_download:
                  print("❌ خطا: هیچ فایلی پیدا نشد.")
                  sys.exit(1)

              total_files = len(messages_to_download)
              print(f"✅ Found {total_files} file(s). Downloading with 10 parallel threads each...")
              print("========================================")

              for i, message in enumerate(messages_to_download, 1):
                  file_name = message.file.name or f"Unknown_{i}.mp4"
                  file_size = message.file.size
                  file_size_mb = file_size / 1024 / 1024
                  remaining = total_files - i
                  
                  print(f"\n[{i}/{total_files}] {file_name}")
                  print(f"📊 {i-1} downloaded, {remaining} remaining | Size: {file_size_mb:.2f} MB")
                  
                  file_path = out_dir / file_name
                  
                  # ایجاد فایل خالی با حجم نهایی برای رزرو فضا
                  with open(file_path, "wb") as f:
                      f.truncate(file_size)
                      
                  downloaded_bytes = 0 # ریست کردن برای فایل جدید
                  
                  threads = 10
                  part_size = file_size // threads
                  tasks = []
                  
                  # تقسیم فایل به ۱۰ بخش و ساخت تسک برای هر کدام
                  for t in range(threads):
                      offset = t * part_size
                      limit = part_size if t < threads - 1 else file_size - offset
                      tasks.append(download_chunk(client, message, file_path, offset, limit))
                      
                  # اجرای همزمان ۱۰ تسک + مانیتور پیشرفت
                  await asyncio.gather(monitor_progress(file_size), *tasks)
                  
                  print(f"   ✅ Downloaded successfully: {file_name}")
                  print("-" * 50)
                  
              await client.disconnect()
              print("\n🎉 All downloads completed!")

          if __name__ == "__main__":
              asyncio.run(main())
          PY

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: files/*
          fail_on_unmatched_files: true

      - name: Print download links
        run: |
          echo "### 🔗 لینک‌های دانلود" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for file in files/*; do
            if [ -f "$file" ]; then
              FILENAME=$(basename "$file")
              URL_FILENAME=$(echo "$FILENAME" | sed 's/ /%20/g')
              LINK="https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/$URL_FILENAME"
              echo "**$FILENAME**"
              echo "$LINK"
              echo ""
              echo "**$FILENAME**" >> $GITHUB_STEP_SUMMARY
              echo "$LINK" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
