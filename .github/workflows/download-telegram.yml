name: Download from Telegram (Safe & Reliable)

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'تعداد فیلم‌هایی که باید دانلود شوند'
        required: true
        default: '5'
        type: string
      tag:
        description: 'Release tag (مثلاً v1)'
        required: true
        default: 'v1'
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Setup Python & ffmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install telethon cryptg

      - name: Download Safely from Telegram
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.TELEGRAM_SESSION }}
          COUNT: ${{ inputs.count }}
        run: |
          python - <<'PY'
          import os
          import sys
          import subprocess
          from pathlib import Path
          from telethon.sync import TelegramClient
          from telethon.sessions import StringSession

          api_id = int(os.environ["API_ID"])
          api_hash = os.environ["API_HASH"]
          session_str = os.environ["SESSION_STRING"]
          count = int(os.environ.get("COUNT", "5"))

          out_dir = Path("files")
          out_dir.mkdir(exist_ok=True)

          # تابع بررسی سلامت فایل با ffmpeg
          def is_video_valid(file_path):
              try:
                  # تست ۳ ثانیه از ویدیو
                  subprocess.run(
                      ["ffmpeg", "-v", "error", "-i", str(file_path), "-t", "3", "-f", "null", "-"],
                      check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
                  )
                  return True
              except subprocess.CalledProcessError:
                  return False

          print("Connecting to Telegram...")
          with TelegramClient(StringSession(session_str), api_id, api_hash) as client:
              
              messages_to_download = []
              print(f"Searching for the latest {count} files in Saved Messages...")
              
              # گرفتن پیام‌ها
              for msg in client.get_messages('me', limit=100):
                  if msg.media and (msg.video or msg.document):
                      messages_to_download.append(msg)
                      if len(messages_to_download) >= count:
                          break
                          
              if not messages_to_download:
                  print("❌ خطا: هیچ فایلی پیدا نشد.")
                  sys.exit(1)

              total_files = len(messages_to_download)
              print(f"✅ Found {total_files} file(s).")
              print("========================================")

              for i, message in enumerate(messages_to_download, 1):
                  file_name = message.file.name or f"Unknown_{i}.mp4"
                  file_size_mb = message.file.size / 1024 / 1024
                  remaining = total_files - i
                  
                  print(f"\n[{i}/{total_files}] {file_name}")
                  print(f"📊 {i-1} downloaded, {remaining} remaining | Size: {file_size_mb:.2f} MB")
                  
                  file_path = out_dir / file_name
                  max_retries = 3
                  success = False
                  
                  for attempt in range(1, max_retries + 1):
                      if file_path.exists():
                          file_path.unlink() # پاک کردن دانلود ناقص قبلی
                          
                      print(f"   ⬇️ Downloading (Attempt {attempt}/{max_retries})...")
                      try:
                          # دانلود تک‌ترده و استاندارد (بسیار پایدار)
                          client.download_media(message, file=str(file_path))
                          
                          print(f"   🔍 Validating file...")
                          if is_video_valid(file_path):
                              print(f"   ✅ File is valid and healthy!")
                              success = True
                              break
                          else:
                              print(f"   ❌ File is corrupted (moov atom missing). Retrying...")
                      except Exception as e:
                          print(f"   ⚠️ Error: {e}. Retrying...")
                  
                  if not success:
                      print(f"   🚨 Failed to download a healthy version of {file_name} after {max_retries} attempts.")
                      if file_path.exists():
                          file_path.unlink() # فایل خراب رو پاک کن که آپلود نشه
                  
                  print("-" * 50)

          print("\n🎉 Process completed!")
          PY

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: files/*
          fail_on_unmatched_files: false # اگر هیچ فایلی سالم نبود، خطا نده

      - name: Print download links
        run: |
          echo "### 🔗 لینک‌های دانلود (سالم)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for file in files/*; do
            if [ -f "$file" ]; then
              FILENAME=$(basename "$file")
              URL_FILENAME=$(echo "$FILENAME" | sed 's/ /%20/g')
              LINK="https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/$URL_FILENAME"
              echo "**$FILENAME**" >> $GITHUB_STEP_SUMMARY
              echo "$LINK" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
