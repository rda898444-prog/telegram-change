name: Download Multiple (Parallel 10 Threads)

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'تعداد فیلم‌هایی که باید دانلود شوند'
        required: true
        default: '5'
        type: string
      msg_id:
        description: 'شماره پیام خاص (اختیاری)'
        required: false
        type: string
      tag:
        description: 'Release tag (مثلاً v1)'
        required: true
        default: 'v1'
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install telescraper and cryptg (for speed)
        run: |
          pip install telescraper cryptg

      - name: Download from Telegram (Parallel)
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.TELEGRAM_SESSION }}
          MSG_ID: ${{ inputs.msg_id }}
          COUNT: ${{ inputs.count }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          from pathlib import Path
          from telethon.sessions import StringSession
          from telescraper import TeleScraper

          api_id = int(os.environ["API_ID"])
          api_hash = os.environ["API_HASH"]
          session_str = os.environ["SESSION_STRING"]
          msg_id_str = os.environ.get("MSG_ID", "").strip()
          count = int(os.environ.get("COUNT", "5"))

          out_dir = Path("files")
          out_dir.mkdir(exist_ok=True)
          messages_to_download = []

          # اتصال با استفاده از StringSession سازگار با Telethon
          print("Connecting to Telegram (telescraper)...")
          client = TeleScraper(StringSession(session_str), api_id=api_id, api_hash=api_hash)
          client.start()

          # --- پیدا کردن پیام‌ها ---
          if msg_id_str:
              try:
                  msg_id = int(msg_id_str)
                  msg = client.get_messages('me', ids=msg_id)
                  if msg and msg.media:
                      messages_to_download.append(msg)
              except ValueError:
                  pass

          if not messages_to_download:
              print(f"Searching for the latest {count} videos/files in Saved Messages...")
              recent = client.get_messages('me', limit=100)
              for msg in recent:
                  if msg.media and (msg.video or msg.document):
                      messages_to_download.append(msg)
                      if len(messages_to_download) >= count:
                          break

          if not messages_to_download:
              print("❌ خطا: هیچ فایلی پیدا نشد.")
              sys.exit(1)

          total_files = len(messages_to_download)
          print(f"✅ Found {total_files} file(s). Downloading with 10 parallel threads each...")
          print("========================================")

          for i, message in enumerate(messages_to_download, 1):
              file_name = message.file.name or f"Unknown_{i}.mp4"
              file_size = message.file.size / 1024 / 1024
              remaining = total_files - i
              
              print(f"\n[{i}/{total_files}] {file_name}")
              print(f"📊 {i-1} downloaded, {remaining} remaining | Size: {file_size:.2f} MB")

              # ثبت زمان شروع برای محاسبه سرعت (تقریبی)
              start_time = time.time()

              # دانلود موازی با ۱۰ ترد
              try:
                  downloaded_path = client.download_parallel(
                      message, 
                      output_dir=str(out_dir), 
                      num_threads=10  # <--- تعداد تردهای موازی
                  )
                  
                  elapsed = time.time() - start_time
                  speed = file_size / elapsed if elapsed > 0 else 0
                  
                  if downloaded_path:
                      print(f"   ✅ Done in {elapsed:.1f}s | Avg Speed: {speed:.2f} MB/s")
                  else:
                      print(f"   ❌ Failed: {file_name}")
              except Exception as e:
                  print(f"   ❌ Error downloading {file_name}: {e}")

              print("-" * 50)

          print("\n🎉 All downloads completed!")
          PY

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: files/*
          fail_on_unmatched_files: true

      - name: Print download links
        run: |
          echo "### 🔗 لینک‌های دانلود" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for file in files/*; do
            if [ -f "$file" ]; then
              FILENAME=$(basename "$file")
              URL_FILENAME=$(echo "$FILENAME" | sed 's/ /%20/g')
              LINK="https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/$URL_FILENAME"
              echo "**$FILENAME**"
              echo "$LINK"
              echo ""
              echo "**$FILENAME**" >> $GITHUB_STEP_SUMMARY
              echo "$LINK" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
