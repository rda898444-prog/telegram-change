name: Download from Saved Messages (Auto-Fallback)

on:
  workflow_dispatch:
    inputs:
      msg_id:
        description: 'شماره پیام (اختیاری - اگر خالی باشد، جدیدترین ویدیو را دانلود می‌کند)'
        required: false
        type: string
      tag:
        description: 'Release tag (مثلاً v1)'
        required: true
        default: 'v1'
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Telethon
        run: pip install telethon

      - name: Download from Telegram
        id: tg_download
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.TELEGRAM_SESSION }}
          MSG_ID: ${{ inputs.msg_id }}
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          from telethon.sync import TelegramClient
          from telethon.sessions import StringSession

          api_id = int(os.environ["API_ID"])
          api_hash = os.environ["API_HASH"]
          session_str = os.environ["SESSION_STRING"]
          msg_id_str = os.environ.get("MSG_ID", "").strip()

          out_dir = Path("files")
          out_dir.mkdir(exist_ok=True)
          message = None

          # تابعی برای نمایش درصد پیشرفت دانلود
          progress_state = {"last_mb": 0}
          def progress_callback(current, total):
              current_mb = current / (1024 * 1024)
              total_mb = total / (1024 * 1024)
              # هر ۵ مگابایت یکبار لاگ چاپ می‌شود تا لاگ‌ها شلوغ نشوند
              if current_mb - progress_state["last_mb"] >= 5 or current == total:
                  progress_state["last_mb"] = current_mb
                  percent = (current / total) * 100
                  print(f"⬇️ Progress: {percent:.1f}% ({current_mb:.1f} MB / {total_mb:.1f} MB)", flush=True)

          print("Connecting to Telegram...")
          with TelegramClient(StringSession(session_str), api_id, api_hash) as client:
              
              # --- تلاش اول: استفاده از آیدی پیام ---
              if msg_id_str:
                  try:
                      msg_id = int(msg_id_str)
                      print(f"Looking for specific Message ID: {msg_id} in Saved Messages...")
                      message = client.get_messages('me', ids=msg_id)
                      
                      if not message or not message.media:
                          print(f"⚠️ پیام {msg_id} پیدا نشد یا حاوی فایل نبود. جستجو برای جدیدترین فایل...")
                          message = None
                  except ValueError:
                      print("⚠️ فرمت آیدی پیام نامعتبر است. جستجو برای جدیدترین فایل...")
                      message = None

              # --- تلاش دوم: پیدا کردن جدیدترین فایل ---
              if not message:
                  print("Searching for the latest video/file in Saved Messages...")
                  messages = client.get_messages('me', limit=50)
                  
                  for msg in messages:
                      if msg.media and (msg.video or msg.document):
                          message = msg
                          break

              if not message:
                  print("❌ خطا: هیچ فایل یا ویدیویی در پیام‌های ذخیره شده پیدا نشد.")
                  sys.exit(1)

              # نمایش مشخصات فایل قبل از شروع دانلود
              file_name = message.file.name or "Unknown_Video.mp4"
              file_size = message.file.size / 1024 / 1024
              print("========================================")
              print(f"📁 File Found: {file_name}")
              print(f"⚖️ File Size: {file_size:.2f} MB")
              print(f"🆔 Message ID: {message.id}")
              print("========================================")
              print("Starting download...")

              # دانلود فایل همراه با نمایش درصد پیشرفت
              downloaded_path = client.download_media(
                  message, 
                  file=str(out_dir) + "/",
                  progress_callback=progress_callback
              )
              
              if not downloaded_path:
                  print("\n❌ خطا: دانلود فایل ناموفق بود.")
                  sys.exit(1)
                  
              print(f"\n✅ Downloaded successfully: {downloaded_path}")
              
              filename = os.path.basename(downloaded_path)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"filename_url={filename}\n")
          PY

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: files/*
          fail_on_unmatched_files: true

      - name: Print download link
        run: |
          LINK="https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/${{ steps.tg_download.outputs.filename_url }}"
          echo "🔗 Download link: $LINK"
          {
            echo "### 🔗 لینک دانلود"
            echo ""
            echo '```'
            echo "$LINK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
